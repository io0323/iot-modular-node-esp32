name: ci

# すべてのブランチへの push で動かす（PR の画面には同じコミットの結果が出る）。PR を作る前に CI の合格を確かめるため
on:
  push:

jobs:
  host:
    name: host（ビルド・CTest・契約テスト・ブローカー再起動）
    runs-on: ubuntu-24.04
    env:
      IOTSPEC_MQTT_URL: mqtt://localhost:1883
      IOTSPEC_MQTT_PASSWORD: ci-${{ github.run_id }}
      # ASan・UBSan の指摘はファイルに出し、最後の手順で1件でもあれば失敗にする
      ASAN_OPTIONS: log_path=${{ github.workspace }}/sanitizer/asan:detect_leaks=1
      UBSAN_OPTIONS: log_path=${{ github.workspace }}/sanitizer/ubsan:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ツール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          mkdir -p sanitizer
          cmake --version | head -1
          g++ --version | head -1

      - name: ビルド（host-debug）
        run: |
          cmake --preset host-debug
          cmake --build --preset host-debug 2>&1 | tee build.log
          if grep -E "warning:" build.log; then echo "::error::ビルドに警告がある"; exit 1; fi

      - name: CTest
        run: ctest --preset host-debug --output-on-failure

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Mosquitto（ACL・パスワード付き）
        # services: は使わない（サービスコンテナはリポジトリを取り出す前に起動するので設定ファイルを渡せない。contract-tests.md 第4章）
        run: |
          external/iot-common-spec/deploy/mosquitto/gen_passwd.sh
          docker compose -f external/iot-common-spec/docker-compose.yml up -d mosquitto
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then echo "port 1883 open"; exit 0; fi
            sleep 1
          done
          echo "::error::Mosquitto のポート 1883 が開かない"; exit 1

      - name: 契約テストキット（iot-common-spec v0.2.1）
        run: |
          uv tool install "iotspec @ git+https://github.com/io0323/iot-common-spec@v0.2.1"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: 契約テスト（--role mcu-cpp-01、既定の模擬機器）
        run: iotspec-contract --role mcu-cpp-01 --target-cmd "./build/host/mcu_cpp_01 --log contract-log.jsonl" --junit contract.xml

      - name: 契約テスト（--role mcu-cpp-01、--devices fakehw：ドライバとフェイクの機器）
        if: always()
        run: iotspec-contract --role mcu-cpp-01 --target-cmd "./build/host/mcu_cpp_01 --devices fakehw --log contract-fakehw-log.jsonl" --junit contract-fakehw.xml

      - name: ブローカーの停止・再開（tests/system/broker_restart.py、既定の構成）
        if: always()
        shell: bash  # -o pipefail（tee で失敗を隠さない）
        run: uv run tests/system/broker_restart.py --log broker-restart-log.jsonl 2>&1 | tee broker-restart.txt

      - name: ASan・UBSan の指摘がないこと
        if: always()
        run: |
          if ls sanitizer/* >/dev/null 2>&1; then cat sanitizer/*; echo "::error::サニタイザーの指摘がある"; exit 1; fi
          echo "サニタイザーの指摘なし"

      - name: Mosquitto のログ
        if: always()
        run: docker compose -f external/iot-common-spec/docker-compose.yml logs mosquitto > mosquitto.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract
          path: |
            contract.xml
            contract-log.jsonl
            contract-fakehw.xml
            contract-fakehw-log.jsonl
            broker-restart.txt
            broker-restart-log.jsonl
            mosquitto.log
            sanitizer/
          if-no-files-found: warn

  release:
    name: host-release（-O2 の警告・CTest）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ツール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: ビルド（host-release）
        run: |
          cmake --preset host-release
          cmake --build --preset host-release 2>&1 | tee build-release.log
          if grep -E "warning:" build-release.log; then echo "::error::ビルドに警告がある"; exit 1; fi

      - name: CTest
        run: ctest --preset host-release --output-on-failure

  tsan:
    name: host-tsan（CTest・契約テスト・ブローカー再起動）
    runs-on: ubuntu-24.04
    env:
      IOTSPEC_MQTT_URL: mqtt://localhost:1883
      IOTSPEC_MQTT_PASSWORD: ci-${{ github.run_id }}
      # 指摘はファイルに出し、最後の手順で1件でもあれば失敗にする。Paho の中だけの1件は抑止する（open-questions #89）
      TSAN_OPTIONS: log_path=${{ github.workspace }}/sanitizer/tsan halt_on_error=0 suppressions=${{ github.workspace }}/tools/tsan.supp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ツール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          mkdir -p sanitizer
          # Ubuntu 24.04 のカーネルの既定（mmap_rnd_bits=32）では TSan が起動できないので下げる
          sudo sysctl vm.mmap_rnd_bits=28

      - name: ビルド（host-tsan）
        run: |
          cmake --preset host-tsan
          cmake --build --preset host-tsan 2>&1 | tee build-tsan.log
          if grep -E "warning:" build-tsan.log; then echo "::error::ビルドに警告がある"; exit 1; fi

      - name: CTest
        run: ctest --preset host-tsan --output-on-failure

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Mosquitto（ACL・パスワード付き）
        run: |
          external/iot-common-spec/deploy/mosquitto/gen_passwd.sh
          docker compose -f external/iot-common-spec/docker-compose.yml up -d mosquitto
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then echo "port 1883 open"; exit 0; fi
            sleep 1
          done
          echo "::error::Mosquitto のポート 1883 が開かない"; exit 1

      - name: 契約テストキット（iot-common-spec v0.2.1）
        run: |
          uv tool install "iotspec @ git+https://github.com/io0323/iot-common-spec@v0.2.1"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: 契約テスト（--role mcu-cpp-01、既定の模擬機器、TSan）
        run: iotspec-contract --role mcu-cpp-01 --target-cmd "./build/host-tsan/mcu_cpp_01 --log contract-tsan-log.jsonl" --junit contract-tsan.xml

      - name: ブローカーの停止・再開（TSan）
        if: always()
        shell: bash  # -o pipefail（tee で失敗を隠さない）
        run: uv run tests/system/broker_restart.py --binary ./build/host-tsan/mcu_cpp_01 --log broker-restart-tsan-log.jsonl 2>&1 | tee broker-restart-tsan.txt

      - name: TSan の指摘がないこと
        if: always()
        run: |
          if ls sanitizer/* >/dev/null 2>&1; then cat sanitizer/*; echo "::error::TSan の指摘がある"; exit 1; fi
          echo "TSan の指摘なし"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsan
          path: |
            contract-tsan.xml
            contract-tsan-log.jsonl
            broker-restart-tsan.txt
            broker-restart-tsan-log.jsonl
            sanitizer/
          if-no-files-found: warn

  quality:
    name: 品質（coverage・clang-tidy・cppcheck・lizard・Doxygen）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: tools/quality.sh all（tools/docker/quality.Dockerfile のイメージの中で動かす）
        shell: bash
        run: tools/quality.sh all 2>&1 | tee quality.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality
          path: |
            quality.txt
            build/quality/
          if-no-files-found: warn

  firmware:
    name: ターゲット版（ESP-IDF v5.5.6、ESP32-S3）
    runs-on: ubuntu-24.04
    # Mac と同じ Espressif の公式イメージでビルドする（open-questions #94・#109）
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4

      - name: ビルド（警告ゼロは自分のコンポーネントの -Werror と、src・firmware の警告の grep で確かめる）
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware
          idf.py -B ../build/firmware build 2>&1 | tee ../firmware-build.log
          if grep -E "(/src/|/firmware/).*warning:" ../firmware-build.log; then echo "::error::自分のコンポーネントに警告がある"; exit 1; fi

      - name: イメージの大きさ（idf.py size）
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware
          idf.py -B ../build/firmware size 2>&1 | tee ../firmware-size.txt
          idf.py -B ../build/firmware size-components 2>&1 > ../firmware-size-components.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: |
            firmware-build.log
            firmware-size.txt
            firmware-size-components.txt
            build/firmware/mcu_cpp_01.bin
            build/firmware/mcu_cpp_01.map
          if-no-files-found: warn

  qemu:
    name: QEMU（起動・4つのタスク・BOOT・stats、ファームウェアの契約テスト）
    runs-on: ubuntu-24.04
    # tools/qemu.sh は Mac と同じ espressif/idf:v5.5.6 のイメージを docker run で使う（#94・#120）
    env:
      IOTSPEC_MQTT_PASSWORD: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 起動の試験（構成 qemu：起動・4つのタスク・BOOT の power_on・stats・スタックの残り 25% 以上）
        shell: bash  # -o pipefail（tee で失敗を隠さない）
        run: tools/qemu.sh test 2>&1 | tee qemu-test.txt

      - name: Mosquitto（ACL・パスワード付き）
        if: always()
        run: |
          external/iot-common-spec/deploy/mosquitto/gen_passwd.sh
          docker compose -f external/iot-common-spec/docker-compose.yml up -d mosquitto
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then echo "port 1883 open"; exit 0; fi
            sleep 1
          done
          echo "::error::Mosquitto のポート 1883 が開かない"; exit 1

      - name: ファームウェアの契約テスト（構成 qemu-fakehw、--role mcu-cpp-01。#132）
        if: always()
        shell: bash  # -o pipefail（tee で失敗を隠さない）
        run: tools/qemu.sh contract 2>&1 | tee qemu-contract.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu
          path: |
            qemu-test.txt
            qemu-contract.txt
            build/qemu/
          if-no-files-found: warn
